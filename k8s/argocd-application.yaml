apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ex8-tot
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/cdmi4613/ex8-tot.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true