apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: company-backend
  template:
    metadata:
      labels:
        app: company-backend
    spec:
      containers:
        - name: backend
          image: 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-ex8-backend:b1543e7466b25d1f28a424348aeb422958358789
          ports:
            - containerPort: 8000