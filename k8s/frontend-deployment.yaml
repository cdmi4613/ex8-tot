apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: company-frontend
  template:
    metadata:
      labels:
        app: company-frontend
    spec:
      containers:
        - name: frontend
          image: 925047940866.dkr.ecr.ap-northeast-1.amazonaws.com/std01-ex8-frontend:97413b2e94d7124abfb61d7168a8929da822e7a6
          ports:
            - containerPort: 80